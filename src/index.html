<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jenkins B2</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page-shell">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">CI/CD starter</p>
        <h1 id="page-title">Jenkins B2</h1>
        <p class="lede">
          A compact static project with a Jenkins pipeline that validates, tests,
          packages, and archives the site.
        </p>
        <dl class="status-grid">
          <div>
            <dt>Pipeline</dt>
            <dd>Declarative</dd>
          </div>
          <div>
            <dt>Artifact</dt>
            <dd>dist/</dd>
          </div>
          <div>
            <dt>Agent</dt>
            <dd>Linux or Windows</dd>
          </div>
        </dl>
        <p class="build-time">
          Page loaded at <time id="build-time">pending</time>
        </p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
